name: Promote to production

# Manual only. The `production` environment must have required reviewers,
# so a person approves every run before any step starts.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to confirm'
        required: true

permissions:
  contents: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    if: inputs.confirm == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/api/package-lock.json

      - run: npm ci
      - run: npm ci --prefix workers/api

      # Stops a launch that still has placeholder values in the production Worker config (domain, Supabase ref, origins, sender...).
      # The demo seed is never part of this workflow: `supabase db push` runs without --include-seed.
      - name: Preflight - no placeholders left in the production Worker config
        run: |
          if awk '/^\[env\.production/{p=1} p' workers/api/wrangler.toml | grep -nE 'REPLACE|example\.invalid'; then
            echo "::error::workers/api/wrangler.toml still has placeholder values in the production section (listed above). Replace them first: docs/backend/LAUNCH_CHECKLIST.md"
            exit 1
          fi

      - name: Apply migrations to production
        run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          npx supabase db push

      - name: Deploy production Worker
        run: npx wrangler deploy --env production
        working-directory: workers/api

      # Runs when the repository variable PROD_API_URL is set (for example https://api.<domain>).
      - name: Smoke test - the production Worker answers and says it is production
        if: vars.PROD_API_URL != ''
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "${{ vars.PROD_API_URL }}/health" || true)
            echo "$body"
            if echo "$body" | grep -q '"env":"production"'; then exit 0; fi
            sleep 10
          done
          echo "::error::/health did not answer with env production"
          exit 1
