name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/api/package-lock.json

      - run: npm ci
      - run: npm ci --prefix workers/api

      - name: Lint
        run: npm run lint

      - name: Type check (frontend and Worker)
        run: |
          npm run typecheck
          npm run worker:typecheck

      - name: Worker tests
        run: npm run worker:test

      - name: Build (also writes the Content-Security-Policy)
        run: npm run build

      - name: No server secret in the built frontend
        run: node scripts/check-bundle-secrets.mjs dist

      - name: Start local Supabase
        # Retry once: the first start occasionally fails with a transient port-binding error.
        run: |
          npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit \
            || { npx supabase stop --no-backup; npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit; }

      - name: pgTAP tests
        run: npm run db:test

      - name: Seat lock under concurrency (two sessions, one seat)
        run: npm run db:race

      - name: RLS check
        run: npm run db:rls

      - name: Security advisors (no warnings allowed)
        run: npx supabase db advisors --type security --fail-on warn

      - name: Performance advisors (no warnings allowed)
        run: npx supabase db advisors --type performance --fail-on warn

      - name: Generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code src/types/database.ts

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm ci --prefix workers/api

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Mailpit stays on: the tests read the sign-in code from it.
      - name: Start local Supabase
        run: |
          npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector \
            || { npx supabase stop --no-backup; npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector; }

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
