<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Kollide sign-in code</title>
  </head>
  <body style="margin:0;padding:0;background:#FBF7F0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FBF7F0;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
            <tr>
              <td style="padding:0 0 20px 0;font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:bold;color:#3B3B98;">
                Kollide
              </td>
            </tr>
            <tr>
              <td style="background:#FFFFFF;border:1px solid #E8DFCF;border-radius:16px;padding:32px 28px;font-family:Helvetica,Arial,sans-serif;color:#2A2A3C;">
                <p style="margin:0 0 8px 0;font-size:16px;line-height:24px;">Hi there,</p>
                <p style="margin:0 0 24px 0;font-size:16px;line-height:24px;">
                  Use this code to sign in to Kollide.
                </p>
                <p style="margin:0 0 24px 0;text-align:center;">
                  <span style="display:inline-block;background:#3B3B98;color:#FFFFFF;border-radius:12px;padding:14px 24px;font-family:'Courier New',monospace;font-size:34px;letter-spacing:10px;font-weight:bold;border-bottom:4px solid #F2A93B;">{{ .Token }}</span>
                </p>
                <p style="margin:0 0 8px 0;font-size:14px;line-height:22px;color:#5A5A70;">
                  The code works for 10 minutes. Enter it on the page where you asked for it.
                </p>
                <p style="margin:0;font-size:14px;line-height:22px;color:#5A5A70;">
                  Didn't ask for this? You can ignore this email. Nobody can sign in without the code.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 8px 0 8px;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#8A8AA0;text-align:center;">
                Kollide &middot; Social events in Bengaluru
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
